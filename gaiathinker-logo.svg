<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-label="GaiaThinker logo mark">
  <title>GaiaThinker</title>
  <desc>A leaf-flame shape with three neural branch nodes, representing Gaia (nature) and Thinker (AI intelligence). Gradient from teal to blue.</desc>
  <defs>
    <!-- Primary gradient: teal → MS blue -->
    <linearGradient id="gt-grad-primary" x1="14" y1="52" x2="40" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B294"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <!-- Dark background variant: brighter gradient -->
    <linearGradient id="gt-grad-dark" x1="14" y1="52" x2="40" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B294"/>
      <stop offset="100%" stop-color="#4FC3E8"/>
    </linearGradient>
  </defs>

  <!--
    GAIATHINKER MARK — Final
    ═══════════════════════════════════════════════
    Shape: Asymmetric leaf-flame (pointed top, fuller
    left curve, subtle right-side flame inflection).
    Interior: 1 bold stem + 3 neural branch nodes.
    Works at 16px favicon → 8ft billboard.

    Colours:
      Primary  — gradient #00B294 → #0078D4
      Flat     — solid #0078D4
      Reversed — solid white (for dark backgrounds)
    ═══════════════════════════════════════════════
  -->

  <!-- LEAF BODY -->
  <path
    d="M28 4
       C22 7, 10 16, 10 27
       C10 40, 18 50, 28 52
       C38 50, 48 40, 46 28
       C44 18, 36 10, 28 4
       Z"
    fill="url(#gt-grad-primary)"
  />

  <!-- STEM (bottom to junction) -->
  <line x1="28" y1="50" x2="28" y2="30"
    stroke="white" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>

  <!-- JUNCTION to TOP -->
  <line x1="28" y1="30" x2="28" y2="14"
    stroke="white" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>

  <!-- LEFT BRANCH -->
  <line x1="28" y1="30" x2="17" y2="18"
    stroke="white" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- RIGHT BRANCH -->
  <line x1="28" y1="30" x2="39" y2="18"
    stroke="white" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- BRANCH END NODES -->
  <circle cx="17" cy="18" r="2.8" fill="white" opacity=".95"/>
  <circle cx="39" cy="18" r="2.8" fill="white" opacity=".95"/>
  <circle cx="28" cy="14" r="2.8" fill="white" opacity=".95"/>

  <!-- JUNCTION NODE (slightly larger — visual anchor) -->
  <circle cx="28" cy="30" r="3.2" fill="white"/>
</svg>
